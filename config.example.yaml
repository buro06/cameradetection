# camwatch configuration. Copy to config.yaml (or run `camwatch setup`).
# Most settings can also be changed live from the dashboard menu (press m → Settings).

data_dir: data            # models, face DB, clips, logs (relative to this file)
rtsp_transport: tcp       # tcp is more reliable than udp over Wi-Fi

detection:
  model: yolo11s.pt       # yolo11n.pt = faster, yolo11m.pt = more accurate; auto-downloaded to data/models
  device: auto            # auto | cuda:0 | cpu
  confidence: 0.5
  imgsz: 640
  detect_fps: 5.0         # inferences per second per camera
  half: false             # keep false on Maxwell GPUs (Quadro M4000): no fast FP16
  min_hits: 2             # detections before a person is considered real (filters flickers)
  min_box_height: 0.0     # ignore people smaller than this fraction of frame height (e.g. 0.1)
  overlap_confirm_seconds: 1.0  # a box on top of someone already tracked must last this long to count
                                # as another person (filters split-second duplicate boxes; 0 = off)

face:
  model: buffalo_l        # InsightFace SCRFD + ArcFace (non-commercial weights); downloaded to data/models
  device: auto            # auto (GPU if onnxruntime can use it, else CPU) | cuda | cpu
  detector_score: 0.5     # SCRFD face confidence
  min_face_px: 40         # faces smaller than this are not recognised
  check_fps: 2.0          # face checks per second per person while identifying them
  match_threshold: 0.35   # ArcFace cosine similarity; raise to 0.4 for fewer false matches
  quality_min_sharpness: 25.0  # blurrier faces don't vote on who someone is
  quality_max_turn: 0.45  # nor do faces turned further away (0 = straight on, ~0.5 = 45°)
  trusted_min_matches: 2  # consistent matches needed before a trusted face suppresses an alert
  save_unknowns: true
  max_unknown_images: 5

events:
  pre_seconds: 0.0        # clip starts this long before the person was first detected (0 = at detection)
  post_seconds: 5.0       # ...and runs this long after; alerts are decided at the end of this window
  cooldown_seconds: 60    # same person leaving and returning within this time doesn't re-alert (per camera)
  track_ttl: 2.0
  lost_memory_seconds: 30 # a still person hidden this long and reappearing in place isn't a new arrival
  handoff_seconds: 1.5    # a walker lost and re-found nearby within this time keeps their track

clip:
  fps: 15
  max_width: 1280
  crf: 28                 # H.264 quality (lower = better/larger)
  annotate: true
  retention_days: 14

telegram:
  enabled: true
  bot_token: ""           # or set env var CAMWATCH_TELEGRAM_TOKEN (preferred)
  chat_ids: []            # chats that receive alerts (use `camwatch setup` to discover)
  allowed_user_ids: []    # users allowed to send commands from any chat
  send_unknown_faces: true
  min_alert_interval_seconds: 30  # hard cooldown per camera: later alerts are clipped + logged, not sent

cameras:
  - name: front-door
    source: "rtsp://user:password@192.168.1.20:554/Streaming/Channels/102"
  - name: desk
    source: "0"           # USB webcam index
    backend: auto         # Windows: dshow (default) or msmf
    width: 1920           # requested capture size (USB only; 0 = driver default)
    height: 1080
    fps: 30               # requested frame rate (USB only; 0 = driver default)
    fourcc: auto          # auto (= MJPG on Windows) | MJPG | YUY2 | none
  - name: garage
    source: "http://192.168.1.30/snapshot.jpg"   # JPEG snapshot URL (polled)
    snapshot_fps: 2
  # - name: porch
  #   source: "https://192.168.1.40:8080/video"  # MJPEG / HLS / any FFmpeg-readable stream
  #   enabled: false
