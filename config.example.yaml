# camwatch configuration. Copy to config.yaml (or run `camwatch setup`).
# Most settings can also be changed live from the dashboard menu (press m → Settings).

data_dir: data            # models, face DB, clips, logs (relative to this file)
rtsp_transport: tcp       # tcp is more reliable than udp over Wi-Fi

detection:
  model: yolo11s.pt       # yolo11n.pt = faster, yolo11m.pt = more accurate; auto-downloaded to data/models
  device: auto            # auto | cuda:0 | cpu
  confidence: 0.5
  imgsz: 640
  detect_fps: 5.0         # inferences per second per camera
  half: false             # keep false on Maxwell GPUs (Quadro M4000): no fast FP16
  person_min_height: 0.15 # people smaller than this fraction of frame height don't count
                          # (twice that if cut off at the frame edge, e.g. an arm poking in)
  vehicle_min_width: 0.08 # vehicles narrower than this fraction of frame width don't count (distant traffic)

face:
  model: buffalo_l        # InsightFace SCRFD + ArcFace (non-commercial weights); downloaded to data/models
  device: auto            # auto (GPU if onnxruntime can use it, else CPU) | cuda | cpu
  detector_score: 0.5     # SCRFD face confidence
  min_face_px: 40         # faces smaller than this are not recognised
  check_fps: 2.0          # face scans per second per camera, inside person boxes, only while someone is in view
  detect_size: 640        # face detector input for whole-frame scans (5+ people, enrollment)
  match_threshold: 0.35   # ArcFace cosine similarity; raise to 0.4 for fewer false matches
  quality_min_sharpness: 25.0  # blurrier faces don't vote on who someone is
  quality_max_turn: 0.45  # nor do faces turned further away (0 = straight on, ~0.5 = 45°)
  min_sightings: 2        # clear sightings a face needs during a clip to count (trusted or not)
  save_unknowns: true
  max_unknown_images: 5

events:
  pre_seconds: 0.0        # clip starts this long before the person appeared (0 = when they appeared)
  post_seconds: 5.0       # ...and runs this long after; alerts are decided at the end of this window
  away_seconds: 30        # someone must be gone this long before coming back alerts again
  arrive_seconds: 2.0     # someone must be in view this long in an empty camera to count as arrived

clip:
  fps: 15
  max_width: 1280
  crf: 28                 # H.264 quality (lower = better/larger)
  annotate: true
  retention_days: 14

telegram:
  enabled: true
  bot_token: ""           # or set env var CAMWATCH_TELEGRAM_TOKEN (preferred)
  chat_ids: []            # chats that receive alerts (use `camwatch setup` to discover)
  allowed_user_ids: []    # users allowed to send commands from any chat
  send_unknown_faces: true
  min_alert_interval_seconds: 30  # hard cooldown per camera, all channels: later alerts are clipped + logged, not sent

ntfy:
  enabled: false
  server: https://ntfy.sh  # or your own server
  topic: ""               # alerts are published to <server>/<topic>
  username: ""            # empty = anonymous
  password: ""            # or set env var CAMWATCH_NTFY_PASSWORD (preferred)
  priority: 4             # 1 (min) … 5 (urgent)
  attach_clip: true       # alerts show a snapshot; upload the clip too and link it (tap → plays)
  clip_topic: ""          # clips are uploaded here; don't subscribe to it (empty = <topic>-clips)

cameras:
  - name: front-door
    source: "rtsp://user:password@192.168.1.20:554/Streaming/Channels/102"
    # armed during these windows, disarmed outside them; [] (default) = arm/disarm by hand only.
    # 24-hour times, optional days (Mon-Fri, Sat,Sun); a window crossing midnight belongs to the day it starts
    schedule: ["Mon-Fri 18:00-07:00", "Sat-Sun 22:00-07:00"]
    vehicles: true        # also alert on moving cars/motorcycles/buses/trucks; parked ones never alert (default false)
  - name: desk
    source: "usb:HD Pro Webcam C920"  # USB webcam by name (Menu → Cameras → Add USB camera), or an index: "0"
    backend: auto         # auto (dshow on Windows, v4l2 on Linux) | dshow | msmf | v4l2
    width: 1920           # requested capture size (USB only; 0 = driver default)
    height: 1080
    fps: 30               # requested frame rate (USB only; 0 = driver default)
    fourcc: auto          # auto (= MJPG on Windows, and on Linux above 640x480) | MJPG | YUY2 | none
  - name: garage
    source: "http://192.168.1.30/snapshot.jpg"   # JPEG snapshot URL (polled)
    snapshot_fps: 2
  # - name: porch
  #   source: "https://192.168.1.40:8080/video"  # MJPEG / HLS / any FFmpeg-readable stream
  #   enabled: false

# HTTP GET on/off: requests on_url when a camera sees a person or moving vehicle that arrived (same checks as
# alerts, after arrive_seconds), and off_url once it's seen nothing for off_after_seconds. For outdoor lights, a relay,
# a webhook, ... OFF is sent at startup and shutdown. Separate from alerts: arming and the alert cooldown don't apply.
# Also set up from Menu → HTTP GET.
http_get: []
