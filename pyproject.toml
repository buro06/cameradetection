[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camwatch"
version = "0.1.0"
description = "24/7 multi-camera person & face detection with Telegram alerts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }  # inherits Ultralytics' AGPL-3.0
dependencies = [
    # Install torch/torchvision FIRST from the CUDA index that matches your GPU (see README).
    "ultralytics>=8.4,<8.5",  # camwatch uses its ByteTrack tracker directly (internal API)
    "opencv-python>=4.8",
    # face models (InsightFace buffalo_l); the GPU build falls back to the CPU on its own
    "onnxruntime-gpu>=1.20; sys_platform != 'darwin'",
    "onnxruntime>=1.20; sys_platform == 'darwin'",
    "numpy",
    "pyyaml",
    "requests",
    "rich>=13",
    "questionary>=2",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
camwatch = "camwatch.cli:main"

[tool.setuptools]
packages = ["camwatch"]
